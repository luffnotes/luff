name: Idea
description: Suggest a feature or improvement.
labels: [idea]
body:
  - type: markdown
    attributes:
      value: |
        Check the open issues first. If someone already suggested this, add a thumbs up there.
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What you would like Luff to do.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why you need it
      description: What you were trying to do, and how you handle it today.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Luff version
      description: Found in Settings > About (optional).
      placeholder: "0.9.13"
